<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>J.A.R.V.I.S.</title>
  <meta name="description" content="J.A.R.V.I.S. – Ihr persönlicher KI-Assistent">
  <meta name="theme-color" content="#03070d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <!-- Seitenleiste mit Chatverlauf -->
  <aside id="sidebar" class="sidebar glass" aria-label="Chatverlauf">
    <div class="sidebar-head">
      <span class="brand">J.A.R.V.I.S.</span>
      <button id="closeSidebar" class="icon-btn" aria-label="Seitenleiste schließen">✕</button>
    </div>
    <button id="newChatSide" class="primary-btn">＋ Neuer Chat</button>
    <input id="searchChats" class="search" type="search" placeholder="Chats durchsuchen" aria-label="Chats durchsuchen">
    <ul id="chatList" class="chat-list"></ul>
    <p class="sidebar-note">Chats werden vorerst nur auf diesem Gerät gespeichert. Benutzerkonten folgen in Phase 2.</p>
  </aside>
  <div id="backdrop" class="backdrop" hidden></div>

  <div class="app">
    <header class="topbar">
      <button id="openSidebar" class="icon-btn" aria-label="Chatverlauf öffnen">☰</button>
      <span class="top-title">J.A.R.V.I.S.</span>
      <button id="newChatTop" class="icon-btn" aria-label="Neuer Chat">＋</button>
    </header>

    <main id="main" class="main">
      <section id="welcome" class="welcome">
        <div id="reactor" class="reactor" aria-hidden="true">
          <div class="ring ring-1"></div>
          <div class="ring ring-2"></div>
          <div class="ring ring-3"></div>
          <div class="segments"></div>
          <div class="core"></div>
        </div>
        <h1 class="greeting">Guten Tag. Ich bin J.A.R.V.I.S.</h1>
        <p class="sub">Wie kann ich Ihnen heute helfen?</p>
        <div class="suggestions">
          <button class="chip" data-prompt="Erkläre mir einfach, wie Künstliche Intelligenz funktioniert.">KI einfach erklärt</button>
          <button class="chip" data-prompt="Hilf mir, eine freundliche E-Mail zu schreiben.">E-Mail schreiben</button>
          <button class="chip" data-prompt="Gib mir 5 kreative Ideen für ein Wochenende.">Ideen sammeln</button>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>
    </main>

    <footer class="composer-wrap">
      <form id="composer" class="composer glass" autocomplete="off">
        <button type="button" id="micBtn" class="icon-btn mic" aria-label="Spracheingabe (folgt in Phase 3)">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
        </button>
        <textarea id="input" rows="1" maxlength="4000" placeholder="Nachricht an J.A.R.V.I.S." aria-label="Nachricht"></textarea>
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Senden">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.39 10.2 15 12 3.39 13.8z"/></svg>
        </button>
        <button type="button" id="stopBtn" class="send-btn stop" aria-label="Antwort stoppen" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
      <p class="disclaimer">J.A.R.V.I.S. kann Fehler machen. Wichtige Informationen bitte prüfen.</p>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
